[project]
name = "todo-list-api"
version = "0.1.0"
description = "Pit Wall: a RESTful to-do list API with JWT auth, refresh token rotation and rate limiting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "fastapi>=0.116.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_list_api"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "pytest>=8.4.0",
    "ruff>=0.15.0",
    "testcontainers[postgres]>=4.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "RET",
    "TID",
    "S",
    "ASYNC",
    "PT",
    "N",
    "FAST",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
